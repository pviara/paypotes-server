name: Node.js CD - Production

on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: appleboy/ssh-action@master
        name: Deploy production on VPS
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          passphrase: ${{ secrets.SERVER_PASSPHRASE }}
          port: 22
          script: |
            export NVM_DIR="/home/github/.nvm"
            source "$NVM_DIR/nvm.sh"
            nvm use 24.12.0
            cd /home/pviara/dev/repos/paypotes/paypotes-server
            git switch main
            git fetch --all
            git reset --hard origin/main
            yarn install
            yarn build
            bash /home/pviara/dev/repos/paypotes/paypotes-server/.github/workflows/scripts/reload-cluster.sh
