name: Node.js CD - Production

on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: appleboy/ssh-action@master
        name: Deploy production on VPS
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          passphrase: ${{ secrets.SERVER_PASSPHRASE }}
          port: 22
          script: |
            export PATH="$PATH:/home/pviara/.nvm/versions/node/v24.12.0/bin/"
            export NVM_DIR=/home/pviara/.nvm
            source /home/pviara/.nvm/nvm.sh
            nvm install 24.12.0
            cd /home/pviara/dev/repos/paypotes/paypotes-server
            git checkout main
            git fetch --all
            git reset --hard origin/main
            yarn install
            yarn build --configuration production
            bash /home/pviara/dev/repos/paypotes/paypotes-server/.github/workflows/scripts/reload-cluster.sh
