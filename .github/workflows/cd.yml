name: Node.js CD - Production

on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: appleboy/ssh-action@master
        name: Deploy production on VPS
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          passphrase: ${{ secrets.SERVER_PASSPHRASE }}
          port: 22
          script: |
            export PATH="$PATH:/home/reginald/.nvm/versions/node/v22.14.0/bin/"
            export NVM_DIR=~/.nvm
            source ~/.nvm/nvm.sh
            nvm install 22.14.0
            cd ~/dev/repos/paypot/paypot-server
            git checkout main
            git fetch --all
            git reset --hard origin/main
            yarn install
            yarn build
            pm2 delete paypot-api
            pm2 start ./dist/src/main.js --namespace paypot --name paypot-api # temporary deactivate cluster when using in memory database
