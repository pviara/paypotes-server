name: Node.js CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Git checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: 'yarn'

      - name: 📦 Install dependencies
        run: yarn install

      - name: 👷 Build project
        run: yarn build

      - name: 🧑‍🔬 Run unit tests
        run: yarn test

      - name: 🧑‍🔬 Run e2e tests
        run: yarn test:e2e

      - name: 🧑‍🔬 Run concurrency tests
        run: yarn test:concurrency